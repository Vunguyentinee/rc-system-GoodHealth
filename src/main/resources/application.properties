spring.application.name=rc_system

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Keep the pool small and let idle connections close so Neon's serverless compute
# can auto-suspend between requests instead of being held awake by idle connections
# (free-tier compute hours are billed while the endpoint is active).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI recommendation service
ai.recommendation.base-url=${AI_SERVICE_URL:http://localhost:8001}
ai.recommendation.api-key=${AI_SERVICE_API_KEY}
ai.recommendation.endpoints.user-based=/api/ai/recommend/user
ai.recommendation.endpoints.item-based=/api/ai/recommend/item
ai.recommendation.endpoints.hybrid=/api/ai/recommend/hybrid
ai.recommendation.endpoints.top-rated=/api/ai/recommend/top-rated
ai.recommendation.connect-timeout-ms=2000
ai.recommendation.read-timeout-ms=5000